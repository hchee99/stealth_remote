name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build portable Windows package
        shell: cmd
        run: build_exe.bat

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthPlayer-Windows-x64
          path: dist/StealthPlayer-windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "dist/StealthPlayer-windows-x64.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archive --clobber
          } else {
            gh release create $tag $archive --generate-notes --title "StealthPlayer $tag"
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
